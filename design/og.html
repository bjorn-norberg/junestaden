<!doctype html>
<!-- Mall för delningsbilden img/og.jpg (1200 × 630). Behöver inte laddas upp till webben.
     Rendera med t.ex. Edge:
     msedge --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png design/og.html
     och spara som JPG. Telefonerna visar skärmdumparna i img/. -->
<html lang="sv"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
  background: radial-gradient(900px 600px at 85% 30%, #161b24 0%, #0e1116 60%); color: #f2efe8; font-family: Inter, sans-serif; }
.text { position: absolute; left: 70px; top: 150px; width: 560px; }
.brand { font: 34px "Instrument Serif", serif; letter-spacing: .2px; }
.brand em { color: #9aa3b0; }
h1 { margin: 52px 0 0; font: 400 82px/1 "Instrument Serif", serif; letter-spacing: -.5px; }
h1 em { color: #9aa3b0; }
p { margin: 28px 0 0; font: 400 22px Inter, sans-serif; color: #9aa3b0; }
.phone { position: absolute; width: 238px; border: 6px solid #2a313c; border-radius: 30px; overflow: hidden; background: #000;
  box-shadow: 0 30px 60px -18px rgba(0,0,0,.85); }
.phone img { display: block; width: 100%; height: auto; }
.p1 { left: 640px; top: 120px; }
.p2 { left: 790px; top: 58px; z-index: 2; }
.p3 { left: 940px; top: 148px; }
</style></head><body>
<div class="text">
  <div class="brand">Junestaden<em>.se</em></div>
  <h1>Webbverktyg för<br><em>bygg</em> och vardag.</h1>
  <p>EPAkollen · Formelkollen · Mängdkollen</p>
</div>
<div class="phone p1"><img src="../public/img/epa.webp" alt=""></div>
<div class="phone p2"><img src="../public/img/vvs.webp" alt=""></div>
<div class="phone p3"><img src="../public/img/mangdkollen.webp" alt=""></div>
</body></html>
