<!doctype html>
<!-- Mall för delningsbilden img/og.jpg (1200 × 630). Behöver inte laddas upp till webben.
     Rendera med: python design/skarmdumpar.py og --skriv
     Telefonerna visar skärmdumparna i public/img/. Samma etiketter och färger som korten på startsidan. -->
<html lang="sv"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
  background: radial-gradient(1000px 520px at 50% -10%, #1a202a 0%, #0e1116 62%); color: #f2efe8; font-family: Inter, sans-serif; }
.brand { position: absolute; left: 72px; top: 40px; font: 30px "Instrument Serif", serif; letter-spacing: .2px; }
.brand em { color: #9aa3b0; }
.by { position: absolute; right: 72px; top: 50px; font: 500 15px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #9aa3b0; }
h1 { position: absolute; left: 72px; top: 92px; margin: 0; font: 400 76px/1 "Instrument Serif", serif; letter-spacing: -.5px; white-space: nowrap; }
h1 em { color: #9aa3b0; }
.row { position: absolute; left: 72px; right: 72px; top: 214px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.col { position: relative; }
.col::before { content: ""; position: absolute; left: -10%; right: -10%; top: 120px; height: 420px;
  background: radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--a) 26%, transparent), transparent 70%); }
.tag { position: relative; font: 600 13px Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--a); }
.name { position: relative; margin: 3px 0 14px; font: 400 33px/1.1 "Instrument Serif", serif; }
.phone { position: relative; border: 6px solid #2a313c; border-radius: 30px; overflow: hidden; background: #000;
  box-shadow: 0 30px 60px -18px rgba(0,0,0,.85); }
.phone img { display: block; width: 100%; height: auto; }
</style></head><body>
<div class="brand">Junestaden<em>.se</em></div>
<div class="by">Gratis · utan inloggning</div>
<h1>Webbverktyg för <em>bygg</em> och vardag.</h1>
<div class="row">
  <div class="col" style="--a:#1fc77a"><div class="tag">Resa</div><div class="name">Nordrange</div><div class="phone"><img src="../public/img/nordrange.webp" alt=""></div></div>
  <div class="col" style="--a:#ff8a3d"><div class="tag">VVS</div><div class="name">Formelkollen</div><div class="phone"><img src="../public/img/vvs.webp" alt=""></div></div>
  <div class="col" style="--a:#ffc21a"><div class="tag">Bygg</div><div class="name">Mängdkollen</div><div class="phone"><img src="../public/img/mangdkollen.webp" alt=""></div></div>
  <div class="col" style="--a:#d4ff3a"><div class="tag">Resa</div><div class="name">EPAkollen</div><div class="phone"><img src="../public/img/epa.webp" alt=""></div></div>
</div>
</body></html>
