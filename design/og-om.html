<!doctype html>
<!-- Mall för delningsbilden img/og-om.jpg (1200 × 630) till junestaden.se/om. Behöver inte laddas upp till webben.
     Rendera med: python design/skarmdumpar.py og-om --skriv
     Samma uttryck som og.jpg: märket uppe till vänster och verktygens färger. -->
<html lang="sv"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
  background: radial-gradient(800px 600px at 80% 50%, #1a1d24 0%, #0e1116 65%); color: #f2efe8; font-family: Inter, sans-serif; }
.text { position: absolute; left: 72px; top: 150px; width: 660px; }
.brand { position: absolute; left: 72px; top: 40px; font: 30px "Instrument Serif", serif; letter-spacing: .2px; }
.brand em { color: #9aa3b0; }
h1 { margin: 0; font: 400 86px/1 "Instrument Serif", serif; letter-spacing: -.5px; }
h1 em { color: #9aa3b0; }
p { margin: 26px 0 0; font: 400 23px/1.45 Inter, sans-serif; color: #9aa3b0; }
.chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 10px; }
.chips span { font: 500 17px Inter, sans-serif; color: #f2efe8; border: 1px solid #2b323d; background: #151a22; border-radius: 999px; padding: 9px 16px; }
.photo { position: absolute; right: 80px; top: 95px; width: 360px; height: 360px; border-radius: 30px; overflow: hidden; border: 1px solid #2b323d;
  box-shadow: 0 30px 70px -20px rgba(0,0,0,.9); }
.glow { position: absolute; right: 20px; top: 100px; width: 480px; height: 430px; filter: blur(34px); opacity: .9;
  background: radial-gradient(closest-side at 22% 78%, rgba(31,199,122,.30), transparent), radial-gradient(closest-side at 78% 78%, rgba(212,255,58,.22), transparent), radial-gradient(closest-side at 50% 20%, rgba(255,138,61,.26), transparent), radial-gradient(closest-side at 80% 30%, rgba(255,194,26,.20), transparent); }
.tools { position: absolute; right: 80px; top: 478px; width: 360px; display: flex; justify-content: space-between; font: 600 13px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #9aa3b0; }
.tools i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style></head><body>
<div class="brand">Junestaden<em>.se</em></div>
<div class="text">
  <h1>Jag är Björn <em>Norberg</em></h1>
  <p>VVS-student med 20 år i byggbranschen.<br>Jag bygger verktyg för bygg och vardag.</p>
</div>
<div class="chips"><span>TUC Yrkeshögskola</span><span>Jönköping</span><span>20 år i byggbranschen</span></div>
<div class="glow"></div>
<div class="photo"><img src="../public/img/bjorn.jpg" alt=""></div>
<div class="tools"><span><i style="background:#1fc77a"></i>Resa</span><span><i style="background:#ff8a3d"></i>VVS</span><span><i style="background:#ffc21a"></i>Bygg</span><span><i style="background:#d4ff3a"></i>EPA</span></div>
</body></html>
