<!doctype html>
<!-- Mall för delningsbilden img/og-om.jpg (1200 × 630) till junestaden.se/om. Behöver inte laddas upp till webben.
     Renderas i 2x och skalas ner till 1200 × 630, sparas som JPG. -->
<html lang="sv"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
  background: radial-gradient(800px 600px at 80% 50%, #1a1d24 0%, #0e1116 65%); color: #f2efe8; font-family: Inter, sans-serif; }
.text { position: absolute; left: 76px; top: 120px; width: 640px; }
.brand { font: 32px "Instrument Serif", serif; }
.brand em { color: #9aa3b0; }
h1 { margin: 46px 0 0; font: 400 86px/1 "Instrument Serif", serif; letter-spacing: -.5px; }
h1 em { color: #9aa3b0; }
p { margin: 26px 0 0; font: 400 23px/1.45 Inter, sans-serif; color: #9aa3b0; }
.chips { position: absolute; left: 76px; bottom: 70px; display: flex; gap: 10px; }
.chips span { font: 500 17px Inter, sans-serif; color: #f2efe8; border: 1px solid #2b323d; background: #151a22; border-radius: 999px; padding: 9px 16px; }
.chips span.lia { border-color: #1f6b48; background: #10241b; }
.photo { position: absolute; right: 80px; top: 95px; width: 360px; height: 360px; border-radius: 30px; overflow: hidden; border: 1px solid #2b323d;
  box-shadow: 0 30px 70px -20px rgba(0,0,0,.9); }
.glow { position: absolute; right: 40px; top: 160px; width: 440px; height: 360px; background: radial-gradient(closest-side, rgba(255,138,61,.22), transparent); filter: blur(20px); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style></head><body>
<div class="text">
  <div class="brand">Junestaden<em>.se</em></div>
  <h1>Jag är Björn <em>Norberg</em></h1>
  <p>VVS-student med 20 år i byggbranschen.<br>Jag bygger verktyg för bygg och vardag.</p>
</div>
<div class="chips"><span>TUC Yrkeshögskola</span><span>Jönköping</span><span class="lia">Söker LIA v. 33–44, 2027</span></div>
<div class="glow"></div>
<div class="photo"><img src="../public/img/bjorn.jpg" alt=""></div>
</body></html>
