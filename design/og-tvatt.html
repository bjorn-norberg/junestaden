<!doctype html>
<!-- Mall för delningsbilden img/og-tvatt.jpg (1200 × 630) till sidan /tvattstuga. Behöver inte laddas upp.

<html lang="sv"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
  background: radial-gradient(900px 560px at 78% 70%, #13243a 0%, #0e1116 62%); color: #f2efe8; font-family: Inter, sans-serif; }
.brand { position: absolute; left: 72px; top: 44px; font: 30px "Instrument Serif", serif; letter-spacing: .2px; }

.text { position: absolute; left: 72px; top: 170px; width: 470px; }
.tag { font: 600 15px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #5aa9ff; }
h1 { margin: 10px 0 18px; font: 400 76px/1 "Instrument Serif", serif; letter-spacing: -.5px; }
h1 em { color: #9aa3b0; }
p { margin: 0; font: 400 24px/1.45 Inter, sans-serif; color: #c4cad3; }
.screens { position: absolute; left: 600px; top: 0; width: 600px; height: 630px; }
.s { position: absolute; width: 290px; border: 6px solid #2a313c; border-radius: 22px; overflow: hidden; background: #f6f7f9;
  box-shadow: 0 30px 60px -18px rgba(0,0,0,.85); }
.s img { display: block; width: 100%; height: auto; }
.s1 { left: 10px; top: 150px; }
.s2 { left: 250px; top: 70px; z-index: 2; }
</style></head><body>
<div class="brand">Junestaden<em>.se</em></div>
<div class="text">
  <div class="tag">Bokning</div>
  <h1>Tvättstuge<em>bokning</em></h1>

</div>
<div class="screens">
  <div class="s s1"><img src="tvatt/bokad.png" alt=""></div>
  <div class="s s2"><img src="tvatt/boka.png" alt=""></div>
</div>
